name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the patch tools on made-up data, including every case they must refuse (no Simagic file is involved)
      - run: python -m unittest discover -s tools/tests -v
